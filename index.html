<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プルエクステ診断</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:#f5f4f0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px 40px}
#app{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
.header{text-align:center;padding:8px 0 4px}
.header h1{font-size:20px;font-weight:700;color:#1a1a1a;letter-spacing:-.3px}
.header p{font-size:13px;color:#aaa;margin-top:4px}
.progress-wrap{background:#e8e6e0;border-radius:20px;height:4px;overflow:hidden}
.progress-bar{height:4px;background:#1a1a1a;border-radius:20px;transition:width .4s ease}
.progress-label{font-size:11px;color:#bbb;text-align:right;margin-top:4px}
.q-card{background:#fff;border:1px solid #e8e6e0;border-radius:16px;padding:22px 20px;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.q-step{font-size:10px;font-weight:700;letter-spacing:.1em;color:#bbb;margin-bottom:6px}
.q-title{font-size:17px;font-weight:700;color:#1a1a1a;line-height:1.4;margin-bottom:4px}
.q-hint{font-size:12px;color:#bbb;margin-bottom:16px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid #e8e6e0;background:#fff;color:#1a1a1a;font-size:14px;font-family:inherit;cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:center;justify-content:space-between;font-weight:500}
.opt:hover{border-color:#aaa;background:#faf9f7}
.opt.selected{border-color:#1a1a1a;background:#f5f4f0}
.opt.disabled{opacity:.35;cursor:not-allowed;background:#f5f4f0;border-color:#e8e6e0}
.opt-inner{display:flex;flex-direction:column}
.opt-sub{font-size:11px;color:#bbb;font-weight:400;margin-top:2px}
.opt-check{width:20px;height:20px;border-radius:50%;border:1.5px solid #ddd;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.opt.selected .opt-check{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.opts-row{display:grid;gap:8px}
.opts-2{grid-template-columns:1fr 1fr}
.opts-3{grid-template-columns:1fr 1fr 1fr}
.opts-5{grid-template-columns:repeat(5,1fr)}
.opts-row .opt{text-align:center;justify-content:center;padding:13px 6px;flex-direction:column;gap:4px;align-items:center}
.opts-row .opt-check{display:none}
#cam-area{position:relative;background:#f0ede8;border:1.5px dashed #d0cdc8;border-radius:14px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;max-height:240px;cursor:pointer}
#cam-area:hover{background:#ece9e4}
#video{width:100%;height:100%;object-fit:cover;display:none;transform:scaleX(-1)}
#sc{width:100%;height:100%;object-fit:cover;display:none;position:absolute;top:0;left:0}
#ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:#c0bdb8;pointer-events:none}
#ph svg{width:36px;height:36px}
#ph span{font-size:13px;font-weight:500}
#ph small{font-size:11px;opacity:.7}
.cam-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cam-btn{padding:11px;border-radius:10px;border:1px solid #ddd;background:#fff;color:#1a1a1a;font-size:13px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500;transition:all .15s}
.cam-btn:hover{background:#f5f4f0}
.cam-btn.primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a;grid-column:1/-1}
.cam-btn.primary:hover{background:#333}
.result-card{background:#fff;border:1px solid #e8e6e0;border-radius:16px;padding:20px;animation:fadeUp .4s ease}
.result-section{margin-top:16px;padding-top:16px;border-top:1px solid #f0ede8}
.result-section:first-child{margin-top:0;padding-top:0;border-top:none}
.rs-label{font-size:10px;font-weight:700;letter-spacing:.1em;color:#bbb;margin-bottom:10px}
.color-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.cc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border-radius:10px;border:1px solid #e8e6e0;background:#fff}
.t1{border:2.5px solid #c49a6c}.t2{border:1.5px solid #aaa}.t3{border:1px solid #e0ddd8}
.sw{width:38px;height:38px;border-radius:8px;border:1px solid #e8e6e0}
.cn{font-size:12px;color:#1a1a1a;text-align:center;font-weight:600}
.cs{font-size:10px;color:#bbb;text-align:center;line-height:1.2}
.rb{font-size:9px;padding:2px 6px;border-radius:20px;font-weight:700}
.r1{background:#fff8e1;color:#e6a800}.r2{background:#f5f4f0;color:#888}.r3{background:#f5f4f0;color:#bbb}
.honsu-big{background:linear-gradient(135deg,#1a1a1a,#3d3d3d);border-radius:14px;padding:20px;color:#fff;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.honsu-num-wrap{display:flex;align-items:baseline;gap:4px}
.honsu-num{font-size:56px;font-weight:700;letter-spacing:-3px;line-height:1}
.honsu-unit{font-size:16px;opacity:.6}
.honsu-len{font-size:13px;opacity:.7;margin-top:4px}
.breakdown{margin-top:12px;background:rgba(255,255,255,.08);border-radius:10px;padding:12px;min-width:180px}
.bd-row{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:3px 0;opacity:.75}
.bd-row.base{opacity:1;font-weight:600}
.bd-row.total-row{opacity:1;font-weight:700;font-size:13px;border-top:1px solid rgba(255,255,255,.15);margin-top:4px;padding-top:6px}
.plus{color:#81c784}.minus{color:#ef9a9a}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.tr{background:#fde8e8;color:#c62828}.ta{background:#e3f2fd;color:#1565c0}.tb{background:#fff8e1;color:#e65100}.tk{background:#f5f4f0;color:#666}
.ai-box{background:#f5f4f0;border-radius:12px;padding:14px;font-size:13px;color:#555;line-height:1.8}
.sp{display:inline-block;width:13px;height:13px;border:2px solid #ddd;border-top-color:#1a1a1a;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.detected-row{display:flex;align-items:center;gap:12px;padding:12px;background:#f5f4f0;border-radius:10px;margin-bottom:10px}
.det-sw{width:40px;height:40px;border-radius:8px;flex-shrink:0;border:1px solid #e8e6e0}
.det-info{font-size:13px;color:#555}
.det-info strong{display:block;font-size:15px;font-weight:600;color:#1a1a1a}
.note-box{font-size:12px;color:#888;background:#f5f4f0;border-radius:10px;padding:10px 14px;line-height:1.7;margin-top:10px}
.restart-btn{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;background:#fff;color:#888;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500;margin-top:4px}
.restart-btn:hover{background:#f5f4f0}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>プルエクステ診断</h1>
    <p>いくつかの質問に答えて最適なカラーと本数を確認しましょう</p>
  </div>
  <div id="progress-area" style="display:none">
    <div class="progress-wrap"><div class="progress-bar" id="pbar" style="width:0%"></div></div>
    <div class="progress-label" id="plabel"></div>
  </div>
  <div id="question-area"></div>
  <div id="photo-area" style="display:none"></div>
  <div id="result-area" style="display:none"></div>
</div>

<script>
// ========== カラーデータ ==========
const COLORS=[
  {id:'1#',  hex:'#100c0a',L:8,  g:'standard',w:true},
  {id:'2#',  hex:'#1e1108',L:15, g:'standard',w:true},

  {id:'1A',  hex:'#1a1618',L:10, g:'ash',w:false},
  {id:'4A',  hex:'#342a2c',L:22, g:'ash',w:false},
  {id:'9A',  hex:'#6a5e58',L:42, g:'ash',w:false},
  {id:'12A', hex:'#8a7e78',L:54, g:'ash',w:false},
  {id:'17A', hex:'#a89e98',L:64, g:'ash',w:false},
  {id:'20A', hex:'#c4bbb5',L:74, g:'ash',w:false},
  {id:'4B',  hex:'#3c1a1a',L:18, g:'red',w:true},

  {id:'10R', hex:'#a85040',L:44, g:'red',w:true},
  {id:'GB',  n:'グレーベージュ',hex:'#a09480',L:60,g:'beige',w:false},
  {id:'PB',  n:'ペールベージュ',hex:'#c8bfb0',L:74,g:'beige',w:false},
  {id:'HB',  n:'ハニーベージュ',hex:'#c8aa70',L:70,g:'beige',w:true},
  {id:'GRAY',             n:'GRAY',            hex:'#a0a0a0',L:63,g:'special',wo:false,co:true},
  {id:'20W',              n:'20W',             hex:'#e0d8c8',L:86,g:'special',wo:true, co:true},
  {id:'SMOKYGRAY',        n:'SMOKYGRAY',       hex:'#909090',L:56,g:'special',wo:false,co:true},
  {id:'桜ピンク',         n:'桜ピンク',        hex:'#e88090',L:65,g:'special',wo:true, co:false},
  {id:'パステルパープル', n:'パステルパープル',hex:'#b090c8',L:65,g:'special',wo:true, co:true},
  {id:'ディープブルー',   n:'ディープブルー',  hex:'#1e3050',L:22,g:'special',wo:false,co:true},
];

// ========== 本数基準テーブル ==========
// BASE_HONSU[地毛の長さグループ][グレード][希望の長さ] = 本数 (nullは非対応)
const BASE_HONSU = {
  // 肩上・肩
  short: {
    platinum: {'胸トップ上':100, '胸トップ下':110, 'へそ上':null},
    diamond:  {'胸トップ上':100, '胸トップ下':110, 'へそ上':110},
  },
  // 鎖骨・鎖骨下
  mid: {
    platinum: {'胸トップ上':90, '胸トップ下':100, 'へそ上':null},
    diamond:  {'胸トップ上':90, '胸トップ下':100, 'へそ上':100},
  },
  // 胸上
  long: {
    platinum: {'胸トップ上':null, '胸トップ下':100, 'へそ上':null},
    diamond:  {'胸トップ上':null, '胸トップ下':90,  'へそ上':100},
  },
};

// 地毛の長さ → グループのマッピング
function hairLenGroup(v){
  if(v==='肩上'||v==='肩') return 'short';
  if(v==='鎖骨'||v==='鎖骨下') return 'mid';
  return 'long'; // 胸上
}

    id:'hairlen', step:1,
    title:'現在の地毛の長さを教えてください',
    hint:'エクステの取付け本数の基準になります',
    opts:[

      {val:'肩',    label:'肩'},
      {val:'鎖骨',  label:'鎖骨'},
      {val:'鎖骨下',label:'鎖骨下'},
      {val:'胸上',  label:'胸上'},
    ],
    rowClass:'opts-row opts-5'
  },
  {

    title:'希望のエクステの種類を教えてください',
    hint:'長さと毛質が異なります',
    opts:[

    opts:'dynamic',
  },

    id:'vol', step:4,
    title:'地毛の毛量はどのくらいですか？',
    hint:'標準的な方を「普通」としてください',
    opts:[
      {val:'少ない', label:'少ない'},
      {val:'普通',   label:'普通'},
      {val:'多い',   label:'多い'},
    ],
    rowClass:'opts-row opts-3'
  },
  {
    id:'head', step:5,
    title:'頭の大きさはどのくらいですか？',
    hint:'帽子のサイズなどを目安にしてください',
    opts:[
      {val:'小さい', label:'小さい'},
      {val:'普通',   label:'普通'},
      {val:'大きい', label:'大きい'},
    ],
    rowClass:'opts-row opts-3'
  },
  {
    id:'cut', step:6,
    title:'地毛のカットラインは重めですか？',
    hint:'毛先が厚く重なっている場合は「重め」を選んでください',
    opts:[
      {val:'yes', label:'重め'},
      {val:'no',  label:'普通・軽め'},
    ],
    rowClass:'opts-row opts-2'
  },
  {
    id:'redness', step:7,
    title:'現在の髪の色味を教えてください',
    hint:'色味によって馴染みやすいエクステカラーが変わります',
    opts:[
      {val:'red',     label:'赤み・オレンジ系'},
      {val:'brown',   label:'ナチュラルブラウン系'},
      {val:'ash',     label:'アッシュ・グレー系'},
      {val:'beige',   label:'ベージュ系'},
      {val:'hiTone',  label:'ハイトーン・ブリーチ系'},
      {val:'vivid',   label:'派手カラー', sub:'ピンク・パープル・ブルーなど'},
    ],
    rowClass:'opts-row opts-2'
  },
  {
    id:'blackdye', step:8,
    title:'過去1年以内に黒染めをしましたか？',
    hint:'黒染め後は明るくなりにくいため、提案できる明るさが変わります',
    opts:[
      {val:'yes', label:'はい'},
      {val:'no',  label:'いいえ'},
    ],
    rowClass:'opts-row opts-2'
  },
  {
    id:'bleach', step:9,
    title:'過去6ヶ月以内にブリーチをしましたか？',
    hint:'ブリーチ後は褪色しやすいため、1トーン明るめのエクステを提案します',
    opts:[
      {val:'yes', label:'はい'},
      {val:'no',  label:'いいえ'},
    ],
    rowClass:'opts-row opts-2'
  },
];

let answers={};
let stream=null, hasPhoto=false;
let detL=30, detHex='#3d2314', detLabel='ブラウン', detRed=0;

  document.getElementById('pbar').style.width=(((idx+1)/TOTAL_STEPS)*100)+'%';
  document.getElementById('plabel').textContent=(idx+1)+' / '+TOTAL_STEPS;

  const q=QUESTIONS[idx];
  let opts=q.opts;
  let rowClass=q.rowClass||'opts';

  // 希望の長さは動的生成
  if(q.id==='length'){
    const grade=answers.grade||'diamond';
    const group=hairLenGroup(answers.hairlen||'肩');
    const table=BASE_HONSU[group][grade];
    opts=[
      {val:'胸トップ上', label:'胸トップ上', sub:table['胸トップ上']!=null?'基準 '+table['胸トップ上']+'本':'非対応', disabled:table['胸トップ上']==null},

let activeCamTarget = null;
let camFacingMode = {face: 'user', tips: 'environment'};

function triggerUpload(target){ document.getElementById('fi-'+target).click(); }

function startCam(target){
  activeCamTarget = target;
  const facing = camFacingMode[target] || 'user';
  navigator.mediaDevices.getUserMedia({video:{facingMode: facing}})
    .then(s=>{
      if(stream) stream.getTracks().forEach(t=>t.stop());
      stream = s;
      const v = document.getElementById(target+'-video');
      v.srcObject = s;
      v.style.display = 'block';
      document.getElementById(target+'-ph').style.display = 'none';
      document.getElementById(target+'-canvas').style.display = 'none';
      document.getElementById(target+'-ok').style.display = 'none';
      document.getElementById(target+'-cam-controls').style.display = 'block';
    })
    .catch(()=>{ triggerUpload(target); });
}

function switchCam(target){
  camFacingMode[target] = camFacingMode[target]==='user' ? 'environment' : 'user';
  if(stream) stream.getTracks().forEach(t=>t.stop());
  startCam(target);
}

function snapCam(target){
  const v = document.getElementById(target+'-video');
  if(!v || !v.videoWidth) { alert('カメラが起動していません'); return; }
  // 新しいcanvasを作って撮影
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = v.videoWidth;
  tmpCanvas.height = v.videoHeight;
  const ctx = tmpCanvas.getContext('2d');
  if(camFacingMode[target]==='user'){
    ctx.scale(-1,1);
    ctx.drawImage(v,-tmpCanvas.width,0);
  } else {
    ctx.drawImage(v,0,0);
  }
  // カメラを止めてからcanvasに表示
  stopCam(target);
  processCanvas(tmpCanvas, target);
}

function stopCam(target){
  if(stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; }
  const v = document.getElementById(target+'-video');
  if(v){ v.style.display='none'; v.srcObject=null; }
  document.getElementById(target+'-cam-controls').style.display='none';
  // 写真がなければプレースホルダーを戻す
  if(!faceImgData && target==='face') document.getElementById('face-ph').style.display='flex';
  if(!tipsImgData && target==='tips') document.getElementById('tips-ph').style.display='flex';
}

function loadImg(e, target){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      c.width=img.width;c.height=img.height;
      c.getContext('2d').drawImage(img,0,0);
      processCanvas(c, target);
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(f);
}

function processCanvas(srcCanvas, target){
  const displayCanvas = document.getElementById(target+'-canvas');
  if(!displayCanvas){ return; }
  displayCanvas.width=srcCanvas.width;
  displayCanvas.height=srcCanvas.height;
  displayCanvas.getContext('2d').drawImage(srcCanvas,0,0);
  displayCanvas.style.display='block';
  const ph = document.getElementById(target+'-ph');
  if(ph) ph.style.display='none';
  const ok = document.getElementById(target+'-ok');
  if(ok) ok.style.display='block';

  // 色解析
  const w=srcCanvas.width, h=srcCanvas.height;
  const ctx=srcCanvas.getContext('2d');
  // 顔写真は上部(根元)、毛先写真は全体を解析
  const sampleY = target==='face' ? Math.floor(h*0.05) : 0;
  const sampleH = target==='face' ? Math.floor(h*0.35) : h;
  const d=ctx.getImageData(Math.floor(w*0.2),sampleY,Math.floor(w*0.6),sampleH);
  let rS=0,gS=0,bS=0,n=0;
  for(let i=0;i<d.data.length;i+=20){rS+=d.data[i];gS+=d.data[i+1];bS+=d.data[i+2];n++;}
  const r=rS/n,g=gS/n,b=bS/n;
  const mx=Math.max(r,g,b)/255,mn=Math.min(r,g,b)/255;
  const L=((mx+mn)/2)*100;
  const rs=Math.max(0,(r-Math.max(g,b))/255*100);

  if(target==='face'){ faceL=L; faceRed=rs; faceImgData=true; }
  else { tipsL=L; tipsRed=rs; tipsImgData=true; }

  // 顔写真があれば診断ボタンを表示
  if(faceImgData){ document.getElementById('bdiag').style.display='flex'; }
}

// ========== 解析・診断 ==========
function getStats(){
  const c=document.getElementById('sc');if(!c||c.width===0)return{L:35,rs:20};
  const x=c.getContext('2d'),w=c.width,h=c.height;
  const d=x.getImageData(Math.floor(w*.2),Math.floor(h*.05),Math.floor(w*.6),Math.floor(h*.3));
  let rS=0,gS=0,bS=0,n=0;
  for(let i=0;i<d.data.length;i+=20){rS+=d.data[i];gS+=d.data[i+1];bS+=d.data[i+2];n++;}
  const r=rS/n,g=gS/n,b=bS/n;
  const mx=Math.max(r,g,b)/255,mn=Math.min(r,g,b)/255;
  return{L:((mx+mn)/2)*100,rs:Math.max(0,(r-Math.max(g,b))/255*100)};
}
function labelL(L){
  if(L<15)return{name:'ナチュラルブラック',hex:'#0d0a08'};
  if(L<25)return{name:'ダークブラウン',hex:'#2d1a0e'};
  if(L<38)return{name:'ブラウン',hex:'#4a2c1a'};
  if(L<50)return{name:'ミディアムブラウン',hex:'#6b3e28'};
  if(L<62)return{name:'ライトブラウン',hex:'#8b5a3a'};
  if(L<75)return{name:'ゴールドブラウン',hex:'#b88a50'};
  return{name:'ブロンド',hex:'#d8bc80'};
}

function doDiagnose(){
  if(!faceImgData){alert('顔・髪全体の写真を追加してください');return;}

  // 毛先写真があれば毛先L、なければ顔写真Lをエクステ色の基準に使う
  const baseL  = tipsImgData ? tipsL  : faceL;
  const baseRed= tipsImgData ? tipsRed: faceRed;
  detL=faceL; detRed=faceRed;
  const info=labelL(faceL); detHex=info.hex; detLabel=info.name;

  const toneVal  = answers.redness || 'brown';
  const isRed    = toneVal==='red';
  const isAsh    = toneVal==='ash';
  const isBeige  = toneVal==='beige';
  const isHiTone = toneVal==='hiTone';
  const isVivid  = toneVal==='vivid';
  const isBrown  = toneVal==='brown';
  const isBlack  = answers.blackdye==='yes';
  const isBleach = answers.bleach==='yes';
  const baseWarm = isRed || isBrown || isVivid || isHiTone;
  const grade   =answers.grade||'diamond';
  const length  =answers.length||'胸トップ下';
  const hairlen =answers.hairlen||'肩';
  const vol     =answers.vol||'普通';
  const head    =answers.head||'普通';
  const cut     =answers.cut==='yes';
  const group   =hairLenGroup(hairlen);
  const gradeLabel=grade==='platinum'?'プラチナ 40cm':'ダイヤモンド 50cm';

  // --- カラー計算（毛先Lを基準に） ---
  let eL=baseL;
  if(isBleach) eL=Math.min(eL+8,88);
  const maxL=isBlack?faceL+16:100;

  // 色味ごとにプールを決定
  let pool;
  if(isRed){
    pool=COLORS.filter(c=>['standard','red'].includes(c.g));
  } else if(isAsh){
    pool=COLORS.filter(c=>['ash'].includes(c.g));
  } else if(isBeige){
    pool=COLORS.filter(c=>['beige','ash'].includes(c.g));
  } else if(isHiTone){
    pool=COLORS.filter(c=>['standard','beige'].includes(c.g)).filter(c=>c.L>=55);
  } else if(isVivid){
    // 派手カラーは特殊カラー＋ハイトーンを優先
    pool=COLORS.filter(c=>['standard','beige'].includes(c.g)).filter(c=>c.L>=62);
  } else {
    // ナチュラルブラウン系
    pool=COLORS.filter(c=>['standard','ash','beige'].includes(c.g));
  }
  if(isBlack) pool=pool.filter(c=>c.L<=maxL);

  const scored=pool.map(c=>({...c,dist:Math.abs(eL-c.L)})).sort((a,b)=>a.dist-b.dist);

  // 現状の色味に合わせる: 毛先に最も近い2色
  const matchTop=isVivid
    ? COLORS.filter(c=>c.g==='special').slice(0,2)
    : isBeige
      ? COLORS.filter(c=>['beige','ash'].includes(c.g)).map(c=>({...c,dist:Math.abs(eL-c.L)})).sort((a,b)=>a.dist-b.dist).slice(0,2)
      : scored.slice(0,2);

  // 明るくする: 毛先より明るい色を4色
  const lighterPool=pool.filter(c=>c.L>eL+5).sort((a,b)=>a.L-b.L);
  const lighterTop=lighterPool.slice(0,4);

  // 暗くする: 毛先より暗い色を4色
  const darkerPool=pool.filter(c=>c.L<eL-5).sort((a,b)=>b.L-a.L);
  const darkerTop=darkerPool.slice(0,4);

  // デザインカラー: 4色（派手カラーは全色OK）
  const designPool=isVivid
    ? COLORS.filter(c=>c.g==='special').slice(0,4)
    : COLORS.filter(c=>c.g==='special').filter(c=>baseWarm?c.wo:c.co).slice(0,4);

  // --- 本数計算 ---
  const base=BASE_HONSU[group][grade][length];
  const breakdown=[];
  let total=base;
  breakdown.push({label:'基準（'+length+'・'+gradeLabel+'）',val:base,type:'base'});
  if(vol==='少ない'){total-=10;breakdown.push({label:'毛量：少ない',val:-10,type:'minus'});}
  if(vol==='多い'){total+=10;breakdown.push({label:'毛量：多い',val:+10,type:'plus'});}
  if(head==='大きい'){total+=15;breakdown.push({label:'頭の大きさ：大きい',val:+15,type:'plus'});}
  if(cut){total+=10;breakdown.push({label:'カットライン：重め',val:+10,type:'plus'});}
  total=Math.max(total,40);
  breakdown.push({label:'合計',val:total,type:'total-row'});

function colorCards(cols,showR,maxN){
  if(!cols||!cols.length)return'';
  const list=maxN?cols.slice(0,maxN):cols;
  const labels=['最おすすめ','2番目','3番目','4番目'];
  return list.map((c,i)=>`<div class="cc ${showR&&i===0?'t1':showR&&i===1?'t2':''}"><div class="sw" style="background:${c.hex}"></div><div class="cn">${c.id}</div><div class="cs">${c.n||''}</div>${showR&&i<2?`<div class="rb ${i===0?'r1':'r2'}">${labels[i]}</div>`:''}</div>`).join('');
}

}

function getTipsHex() {
  var c = document.getElementById('tips-canvas');
  if(!c || c.width===0) return detHex;
  var ctx = c.getContext('2d');
  var d = ctx.getImageData(Math.floor(c.width*0.2), Math.floor(c.height*0.3), Math.floor(c.width*0.6), Math.floor(c.height*0.4));
  var r=0,g=0,b=0,n=0;
  for(var i=0;i<d.data.length;i+=16){r+=d.data[i];g+=d.data[i+1];b+=d.data[i+2];n++;}
  return '#'+[r,g,b].map(function(v){return Math.round(v/n).toString(16).padStart(2,'0');}).join('');
}

function lightenHex(hex, amount) {
  var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,r+amount); g=Math.min(255,g+amount); b=Math.min(255,b+amount);
  return '#'+[r,g,b].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
}

function darkenHex(hex, amount) {
  var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  r=Math.max(0,r-amount); g=Math.max(0,g-amount); b=Math.max(0,b-amount);
  return '#'+[r,g,b].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
}
